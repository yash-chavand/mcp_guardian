[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-guardian"
version = "0.2.0"
description = "Real-time behavioral anomaly detection gateway & firewall for Model Context Protocol (MCP) servers and AI agents."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "MCP Guardian Authors" }]
keywords = ["mcp", "model-context-protocol", "security", "ai-agents", "anomaly-detection", "firewall", "guardrails"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
requires-python = ">=3.9"
dependencies = [
    "scikit-learn>=1.3",
    "pandas>=2.0",
    "joblib>=1.3",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
]

[project.scripts]
mcp-guardian-proxy = "mcp_guardian.proxy.cli:main"
mcp-guardian-stdio = "mcp_guardian.proxy.stdio_cli:main"

[tool.setuptools.packages.find]
include = ["mcp_guardian*"]

[tool.setuptools.package-data]
mcp_guardian = ["*.joblib", "proxy/static/**/*", "proxy/static/**/**/*", "examples/*"]
